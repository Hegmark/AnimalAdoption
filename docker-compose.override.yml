# Development overrides — applied automatically by `docker compose up`.
# Publishes ports to the host. Uploads use the named volume defined in the base
# file (works consistently across hosts and CI, since the container runs non-root).

services:
  mongo:
    ports:
      - "27017:27017"

  server:
    environment:
      NODE_ENV: development
    ports:
      - "5000:5000"

  client:
    ports:
      - "4200:80"

  mailhog:
    ports:
      - "1025:1025"   # SMTP (for a server running on the host)
      - "8025:8025"   # web UI: http://localhost:8025
