# Development overrides — applied automatically by `docker compose up`.
# Publishes ports to the host and uses a bind mount for uploads so the
# repo's sample images are available and new uploads land back in the repo.

services:
  mongo:
    ports:
      - "27017:27017"

  server:
    environment:
      NODE_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads

  client:
    ports:
      - "4200:80"

  # Seeder shares the server's uploads bind mount so generated images land in ./server/uploads.
  seed:
    volumes:
      - ./server/uploads:/app/uploads

  mailhog:
    ports:
      - "1025:1025"   # SMTP (for a server running on the host)
      - "8025:8025"   # web UI: http://localhost:8025
